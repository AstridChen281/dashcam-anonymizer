model_path: 'weight/license-plate-finetune-v1x.pt'
videos_path: '__PLACEHOLDER__'   # 由 pipeline 脚本覆盖
detection_conf_thresh: 0.18
gpu_avail: True
generate_detections: True
generate_jsons: True
blur_radius: 31
output_folder: '__PLACEHOLDER__'  # 由 pipeline 脚本覆盖
save_frames: False
time_limit: null
imgsz: 1920
detect_batch_size: 8
tta_augment: False
secondary_detection_enabled: False
secondary_imgsz: 2560
secondary_detection_conf_thresh: 0.10
secondary_tta_augment: True
secondary_detect_batch_size: 4
gap_fill_window: 18
gap_fill_mode: interpolate
carry_forward_window: 4
temporal_smoothing: True
temporal_smoothing_alpha: 0.5
stabilize_pad_px: 4
stabilize_pad_ratio: 0.15
stabilize_min_width: 30
stabilize_min_height: 16
stabilize_match_distance_ratio: 2.0
stabilize_match_iou: 0.0
gap_fill_distance_growth_per_frame: 0.75
carry_distance_growth_per_frame: 0.65
temporal_dedupe_iou: 0.3
temporal_dedupe_distance_ratio: 0.8
frame_dedupe_iou: 0.4
frame_dedupe_distance_ratio: 0.75
blur_expand_left_px: 4
blur_expand_right_px: 4
blur_expand_top_px: 2
blur_expand_bottom_px: 6
blur_expand_x_ratio: 0.12
blur_expand_y_ratio: 0.16
debug_keep_artifacts: False
debug_log_details: False
allow_cpu_fallback_on_detection_failure: False
