model_path: 'weight/0422-v1l.pt'
videos_path: '__PLACEHOLDER__'   # 由 pipeline 脚本覆盖
detection_conf_thresh: 0.10
gpu_avail: True
generate_detections: True
generate_jsons: True
blur_radius: 31
output_folder: '__PLACEHOLDER__'  # 由 pipeline 脚本覆盖
save_frames: False
time_limit: null
imgsz: 5120
detect_batch_size: 1
tta_augment: False
secondary_detection_enabled: False
secondary_imgsz: 5120
secondary_detection_conf_thresh: 0.07
secondary_tta_augment: True
secondary_detect_batch_size: 1
gap_fill_window: 18
gap_fill_mode: interpolate
carry_forward_window: 4
temporal_smoothing: True
temporal_smoothing_alpha: 0.45
stabilize_pad_px: 6
stabilize_pad_ratio: 0.18
stabilize_min_width: 40
stabilize_min_height: 20
stabilize_match_distance_ratio: 2.5
stabilize_match_iou: 0.0
gap_fill_distance_growth_per_frame: 0.9
carry_distance_growth_per_frame: 0.8
temporal_dedupe_iou: 0.25
temporal_dedupe_distance_ratio: 0.9
frame_dedupe_iou: 0.35
frame_dedupe_distance_ratio: 0.8
blur_expand_left_px: 6
blur_expand_right_px: 6
blur_expand_top_px: 4
blur_expand_bottom_px: 8
blur_expand_x_ratio: 0.12
blur_expand_y_ratio: 0.18
debug_keep_artifacts: False
debug_log_details: False
allow_cpu_fallback_on_detection_failure: False
